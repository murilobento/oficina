<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Gestão da oficina: orçamentos, vendas, compras e estoque." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Oficina" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Oficina</title>
    <script>
      // Evita o clarão branco no modo escuro antes do app carregar.
      // As demais preferências são aplicadas em src/lib/preferences/boot.ts.
      (function () {
        try {
          var m = document.cookie.match(/(?:^|; )theme_mode=([^;]+)/);
          var modo = m ? m[1] : "light";
          var escuro =
            modo === "dark" || (modo === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", escuro);
          document.documentElement.style.colorScheme = escuro ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
